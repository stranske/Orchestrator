<svg width="680" viewBox="0 0 680 636" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Orchestrator loop: deterministic rails versus callable agent-roles</title>
<desc>A five-stage orchestrator cycle â reap and assess, check in-flight, decide, delegate, monitor and verify â with each component tagged as a deterministic rail (blue) or a swappable-backend agent-role (amber, dashed). RedirectAgent, PromptAgent, DecomposerAgent, TriageAgent, and AdjudicatorAgent are registered shadow roles; an accepted RedirectAgent plan is consumed by the deterministic redirect-apply rail, which authorises from recorded state only and stays behind a default-OFF, self-disabling flag; delegated sub-agents run in isolated worktrees (teal); their outcomes feed feedback.py, which relearns both selection weights and role-to-backend fit and returns them to the next cycle. In Decide, the capability advisor is a rail: it answers which of the tool's capabilities apply to the work in hand, narrowing a 40-plus catalogue to the small set declared for the asking surface before ordering that set by measured usefulness. It selects nothing and dispatches nothing. In Monitor and verify, ux_review (Gate 2) supplements the frontend_verify gate with an evidence-bound usability panel â at least four evaluators plus an adversarial critic â whose evaluations and evidence gaps feed feedback.py, and whose per-evaluator fix-hints and coverage gaps are mined by synthesize_improvements into ranked improvement ideas and the next pass's focus. A final band shows the EXTERNAL BOUNDARY: this whole loop is one component of a pipeline whose system-of-record is the Workflows repo â work originates in an approved-issue queue that an opener lane turns into issues and draft PRs, GitHub Actions keepalive drives those PRs to done, and a closer lane merges and verifies. The Orchestrator touches that pipeline at three points only: the lanes read capacity.py to pick a review agent, a review-fallback path routes advisory reviews through it, and its own active tick applies agent labels to drive keepalive on remote capacity. Double-dispatch is prevented by a coarse freshness heartbeat that makes the lanes yield a whole round, not by a per-issue lock.</desc>
