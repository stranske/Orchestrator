; Mypy configuration. The type check is currently OFF in the Gate — see pr-00-gate.yml's
; "Compute Python CI toggles" step for the blocking and drainable counts. This file exists anyway,
; and for one specific reason: WITHOUT IT `mypy .` CANNOT RUN HERE AT ALL, so the recorded count
; would be unverifiable prose rather than a number anyone can regenerate.
;
; What it fixes: `scripts/langchain/` has no `__init__.py`, so mypy resolves
; scripts/langchain/_llm_client.py as both `_llm_client` and `scripts.langchain._llm_client` and
; aborts with "Source file found twice under different module names ... (errors prevented further
; checking)". That single setup error is what a reader of the failed `typecheck-mypy` job saw —
; it masked the real number completely. `explicit_package_bases` is the resolution mypy's own error
; message recommends, and it is why docs/CI_LINT_BASELINE.md can state 601 rather than "unknown".
;
; NOT a suppression file, deliberately. Nothing here disables an error code or narrows the check:
; a mypy.ini that silenced 588 findings would make the Gate green while checking nothing, which is
; the failure this repo's verify.py exists to stop. The findings stay visible and counted, and the
; check stays honestly off until they are drained.
;
; It must be mypy.ini and NOT pyproject.toml or setup.cfg. `reusable-10-ci-python.yml` adds
; `-e '.[app,dev]'` to its install whenever pyproject.toml / setup.cfg / setup.py exists, and this
; repo is 129 flat root modules with no build backend, so that install fails. mypy discovers
; mypy.ini on its own (no `--config-file` is passed when there is no pyproject.toml), and no other
; tool in the pipeline reads this filename. Re-measure with `python3 scripts/ci_lint_baseline.py`.
[mypy]
explicit_package_bases = True
