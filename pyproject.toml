# pyproject.toml — tool configuration for a NON-PACKAGE repo, and both halves of that matter.
#
# WHY IT CAN EXIST NOW, AND COULD NOT BEFORE. `reusable-10-ci-python.yml` used to append
# `-e '.[app,dev]'` to its install whenever a pyproject.toml existed, on eight separate code paths,
# gated on nothing but the file's presence. This repo has no build backend, so merely creating this
# file broke all five Python jobs at the install step — which is why the Ruff and mypy settings
# originally landed as `ruff.toml` + `mypy.ini` instead. Upstream now guards that with
# `pyproject_declares_distribution()`: the editable install fires only when a project declares
# `[project]`, `[build-system]` or `[tool.poetry]`.
#
# SO THIS FILE DELIBERATELY DECLARES NONE OF THOSE. It is tool configuration, not a distribution.
# Adding `[project]` here would demand a build backend and an explicit list of ~99 top-level
# modules — a hand-maintained list that goes stale on every rename, which is the drift `ruff.toml`
# already refuses for `known-first-party`. Packaging is a separate decision; this is not it.
#
# WHY THE COVERAGE AND MYPY SETTINGS HAD TO MOVE IN HERE. They were not optional migrations. CI
# passes `--cov-config=pyproject.toml` and `--config-file pyproject.toml` WHENEVER this file
# exists, so a `.coveragerc` or `mypy.ini` sitting beside it would be silently ignored: coverage
# would lose `parallel = true` and report whichever subprocess finished last, and mypy would lose
# `explicit_package_bases` and abort on a setup error. Two configs where the tool reads one is
# drift with a delay on it, so those files are deleted rather than kept as decoration.

[tool.pytest.ini_options]
# THE ONE LINE THE `src/` LAYOUT NEEDS. Tests live in `tests/` and the modules in `src/`, so the
# import path has to say so; without it every `import capabilities` in the suite fails at
# collection. Modules invoked directly (`python3 src/tick.py`) do not need it — Python puts the
# script's own directory on `sys.path` — which is why the move required no import rewrites at all.
# `"."` as well as `"src"`, and BOTH entries are load-bearing in different trees. A checkout has
# the modules in `src/`; the EXEC MIRROR is flat (orch-sync-mirror.sh copies them to its root), so
# `src` does not exist there and `.` is what resolves `import capabilities`. pytest ignores a
# pythonpath entry that is not present, so one list is correct in both shapes — the same
# detect-don't-assume rule paths.py applies in Python and orchestrate.sh in shell. Measured, not
# assumed: with only `["src"]` a mirror run collected ZERO tests while reporting the floor unmet.
pythonpath = ["src", "."]
# No `testpaths`. `verify.py` enforces a collection floor as an EQUALITY, so anything here that
# narrows discovery would read as tests silently ceasing to run. Discovery stays as it was.
minversion = "7.0"
markers = [
    "quarantine: excluded from the PR gate by the fleet's marker expression",
    "slow: excluded from the PR gate by the fleet's marker expression",
]

# --------------------------------------------------------------------------------- coverage
# Migrated verbatim in intent from `.coveragerc` (deleted in the same commit — see the header).
#
# WHY parallel mode is the whole point. This project's primary test mechanism is a per-module
# `--selftest`, and verify.py runs each one as a SUBPROCESS. A coverage run that instruments only
# the pytest process therefore cannot see any of it — and that is most of the codebase: 78 modules'
# sole test is a selftest, ~85,500 lines, 79.6% of non-test Python (measured 2026-08-23). The
# reported 48.45% was that blind spot, not missing tests: sampling four of the modules the report
# named as worst showed outcomes.py at 62%, adversarial.py 88%, gh_capacity.py 86%,
# keepalive_outcomes.py 78% under their own selftests, all exiting 0.
#
# `parallel = true` makes every instrumented process write its own `.coverage.<host>.<pid>.<rand>`
# file; `coverage combine` merges them. `verify.py --coverage` does both.
[tool.coverage.run]
parallel = true
# `src`, not `.`: the modules moved, and pointing at the checkout root would measure the tests and
# the tooling instead of the code under test.
source = ["src"]
branch = false
omit = [
    ".venv/*",
    "venv/*",
    "*/site-packages/*",
    "tests/*",
    "conftest.py",
    "src/verify.py",
]

[tool.coverage.report]
# A missing data file means the run did not happen, which must not read as 0% or as success.
skip_empty = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# --------------------------------------------------------------------------------- mypy
# Migrated from `mypy.ini` (deleted in the same commit). The type check is currently OFF in the
# Gate — see pr-00-gate.yml's "Compute Python CI toggles" step for the blocking and drainable
# counts. This config exists anyway, and for one specific reason: WITHOUT IT `mypy` CANNOT RUN HERE
# AT ALL, so the recorded count would be unverifiable prose rather than a number anyone can
# regenerate with `python3 scripts/ci_lint_baseline.py`.
#
# What it fixes: `scripts/langchain/` has no `__init__.py`, so mypy resolves
# `scripts/langchain/_llm_client.py` as both `_llm_client` and `scripts.langchain._llm_client` and
# aborts with "Source file found twice under different module names (errors prevented further
# checking)". That single setup error is what a reader of the failed `typecheck-mypy` job saw — it
# masked the real number completely. `explicit_package_bases` is the resolution mypy's own error
# message recommends.
#
# NOT a suppression file, deliberately. Nothing here disables an error code or narrows the check: a
# config that silenced the findings would make the Gate green while checking nothing, which is the
# failure `verify.py` exists to stop. The findings stay visible and counted, and the check stays
# honestly off until they are drained.
[tool.mypy]
explicit_package_bases = true
# `mypy_path` is what lets mypy resolve this repo's FLAT sibling imports (`import capabilities`)
# now that the modules live under `src/`. Without it every cross-module import reports
# `import-not-found` and the recorded baseline inflates with errors that are an artefact of the
# config rather than the code — 769 instead of 601 when first measured, all of the difference
# spurious. The same reason `pythonpath = ["src"]` exists for pytest above: one relocation, two
# tools that each need telling.
# `tests` as well as `src`: `capability_admission` reads the recurrence-fixture roster from
# `test_capability_set_coverage`, a real and declared dependency (see paths.TESTS_DIR). mypy_path
# affects RESOLUTION only — the check target stays `src`, so the tests are not themselves checked.
mypy_path = ["src", "tests"]

# THE RATCHET, and the reason the check can be ON at all. 87 of the 99 modules are already clean;
# the 12 below are not, and each is exempt BY NAME so the check can run TODAY over the
# clean two-thirds instead of being off over everything. A blanket `ignore_errors` or a
# `disable_error_code` list was rejected: both make the job green while checking nothing, which is
# the defect verify.py exists to stop, and neither has anything to count.
#
# The mandatory latched-gate questions, answered in writing because this IS a gate:
#   1. What decrements it? Typing a module and deleting its line here. Not "time passes".
#   2. Can that run while the gate is CLOSED? Yes — the check being green never blocks typing work,
#      and shortening a plain list needs no permission from the gate it drains.
#   3. Does the measuring window equal the draining window? Yes: ONE list, counted by verify.py and
#      drained by editing these same lines. A second copy of this population would drift.
# It fails toward motion, not silence: verify.py prints the remaining count every run, and
# `.verify-floor.json`'s `mypy_exempt_max` FAILS if the list grows — so new untyped code in a clean
# module is now a red, and a module can never quietly rejoin the exempt set.

[tool.black]
# CI (reusable-10-ci-python.yml:703) runs black with an explicit --line-length 100;
# pinning it here keeps a plain local `black .` byte-identical with the gate.
line-length = 100
# tests/rail_exercises holds exercise INPUTS — the round-authored contracts and fixture harnesses
# a rail is run against — not project code. A formatter or `--fix` that edits them changes what
# the exercise measures (the autofix bot rewrote 125 fixture files and deleted 82 import lines on
# PR #207). `force-exclude` matters: CI's autofix passes explicit file paths, which a plain
# exclude does not cover. Ruff's copy of this rule lives in ruff.toml, which shadows any
# [tool.ruff] table here.
extend-exclude = "^/tests/rail_exercises/"
force-exclude = "^/tests/rail_exercises/"
