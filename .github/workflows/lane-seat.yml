name: Lane seat (hosted controller)

# The hosted controller seat (owner decision 2026-11-24): the SAME lane code the local seats run, from the private
# snapshot repo stranske/lanes, as a backstop. It runs a pass only when the last pass by ANY seat (stamp.json on the
# lanes `state` branch) is older than lane_state.HOSTED_STALE_AFTER (45 min). Ledgers travel on that branch, so a
# hosted pass decides from the same state a local pass would. Design and stop rules:
# Audits/closer-lane-2026-11/rebuild/HOSTED_SEAT_DESIGN.md (owner workspace). Scheduled lanes: closer-core and sync-core (closer parity 2026-11-25, Orchestrator run 45544064284); opener-core joins
# after its parity check (its cap and demand readers do not yet run on Linux).
#
# pull_request: a read-only shadow round (never leases, never pushes state).
# workflow_dispatch: mode shadow (default) or apply; force skips the staleness check (never a live lease).
# schedule: decide, then an apply round only when the last pass is stale.

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: shadow (read-only) or apply
        type: choice
        options: [shadow, apply]
        default: shadow
      force:
        description: run even when the last pass is fresh
        type: boolean
        default: false
      lanes:
        description: comma-separated lanes (always run in the controller's order closer, sync, opener)
        type: string
        default: closer-core,sync-core
  pull_request:
    paths:
      - '.github/workflows/lane-seat.yml'

permissions:
  contents: read

concurrency:
  group: lane-seat
  cancel-in-progress: false

jobs:
  seat:
    name: Hosted controller seat
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.OWNER_PR_PAT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LANE_SEAT_NAME: hosted-github
      # No local agents on a runner: the router offloads opener starts to hosted keepalive and the closer defers local
      # repairs to a local seat (router.local_agent_cap). Without it the absent claims file fails toward LOCAL mode.
      ORCH_LOCAL_AGENT_CAP: '0'
      # A lane joins the scheduled list only after its parity check: the same decisions as the local seat on the
      # same state at the same moment (HOSTED_SEAT_DESIGN.md).
      LANES: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || 'closer-core,sync-core' }}
      ORCH_MIRROR: ${{ github.workspace }}/orch/src
      MODE: ${{ github.event_name == 'schedule' && 'apply' || github.event_name == 'pull_request' && 'shadow' || inputs.mode }}
      FORCE: ${{ github.event_name == 'pull_request' && 'true' || github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
    steps:
      - name: Check out the lane snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stranske/lanes
          ref: main
          path: lanes
          token: ${{ secrets.OWNER_PR_PAT }}
          persist-credentials: false
      - name: Check out Orchestrator (the lanes import its router, dispatcher and roles as ORCH_MIRROR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: orch
          persist-credentials: false
      - name: Check out the Workflows files the lanes read (canaries, model table, issue-format scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stranske/Workflows
          path: workflows
          sparse-checkout: |
            config
            .github/agents
            .github/scripts
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install the lane interpreter's packages (same versions as the local ~/.codex/py314)
        run: python -m pip install --quiet jsonschema==4.26.0 pydantic==2.14.1 PyYAML==6.0.3 requests==2.34.2
      - name: Authenticate git for the lanes state branch
        run: gh auth setup-git
      - name: Decide
        id: decide
        run: |
          args=()
          [ "$FORCE" = "true" ] && args+=(--force)
          python lanes/seat/hosted_seat.py decide "${args[@]}"
      - name: Install the classifier CLI
        if: steps.decide.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run one pass
        if: steps.decide.outputs.run == 'true'
        run: python lanes/seat/hosted_seat.py run --mode "$MODE" --lanes "$LANES" --workflows "$GITHUB_WORKSPACE/workflows"
